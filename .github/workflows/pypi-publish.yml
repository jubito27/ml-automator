name: Publish Python Distribution to PyPI

on:
  release:
    types: [published] # Jab aap GitHub par "Release" button dabayenge tabhi ye chalega

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publishing (OIDC) ke liye ye mandatory hai
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build binary wheel and source tarball
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Note: Yahan username/password ki zaroorat nahi hai 
      # kyunki aapne PyPI par "Trusted Publisher" set kiya hai.
